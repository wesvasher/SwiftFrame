name: SwiftFrame
options:
  bundleIdPrefix: com.wesvasher
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  SwiftFrame:
    type: application
    platform: macOS
    sources:
      - path: SwiftFrame
        excludes:
          - "Resources/AppIcon.icon"
      # Icon Composer file: Xcode compiles it into the app icon.
      - path: SwiftFrame/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: SwiftFrame/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: SwiftFrame Project
            CFBundleTypeIconFile: AppIcon
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.wesvasher.swiftframe.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.wesvasher.swiftframe.project
            UTTypeDescription: SwiftFrame Project
            UTTypeIconFile: AppIcon
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [swiftframe]
          # Frames dragged within the filmstrip.
          - UTTypeIdentifier: com.wesvasher.swiftframe.frame
            UTTypeDescription: SwiftFrame Frame
            UTTypeConformsTo: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wesvasher.swiftframe
        PRODUCT_NAME: SwiftFrame
        INFOPLIST_KEY_CFBundleDisplayName: SwiftFrame
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSCameraUsageDescription: "SwiftFrame uses the camera to capture the frames of your stop motion animation."
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "SwiftFrame uses Bluetooth to fire your camera's shutter when you capture a frame."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Wes Vasher. PolyForm Noncommercial License, with permission to make any animation."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: SwiftFrame/SwiftFrame.entitlements
        COMBINE_HIDPI_IMAGES: YES
  SwiftFrameTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SwiftFrameTests
    dependencies:
      - target: SwiftFrame
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwiftFrame.app/Contents/MacOS/SwiftFrame"
schemes:
  SwiftFrame:
    build:
      targets:
        SwiftFrame: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftFrameTests
